<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" fill="none">
  <defs>
    <linearGradient id="gridFade" x1="500" y1="0" x2="500" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBDDE7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FBDDE7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FBDDE7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Perspective Floor Lines -->
  <g stroke="url(#gridFade)" stroke-width="1.2">
    <!-- Horizontals -->
    <line x1="0" y1="120" x2="1000" y2="120" opacity="0.3"/>
    <line x1="0" y1="170" x2="1000" y2="170" opacity="0.4"/>
    <line x1="0" y1="230" x2="1000" y2="230" opacity="0.5"/>
    <line x1="0" y1="300" x2="1000" y2="300" opacity="0.65"/>
    <line x1="0" y1="380" x2="1000" y2="380" opacity="0.8"/>
    <line x1="0" y1="480" x2="1000" y2="480" opacity="0.95"/>
    <!-- Diagonals converging to vanishing point at (500, 50) -->
    <line x1="500" y1="50" x2="-200" y2="600"/>
    <line x1="500" y1="50" x2="0" y2="600"/>
    <line x1="500" y1="50" x2="150" y2="600"/>
    <line x1="500" y1="50" x2="300" y2="600"/>
    <line x1="500" y1="50" x2="420" y2="600"/>
    <line x1="500" y1="50" x2="500" y2="600"/>
    <line x1="500" y1="50" x2="580" y2="600"/>
    <line x1="500" y1="50" x2="700" y2="600"/>
    <line x1="500" y1="50" x2="850" y2="600"/>
    <line x1="500" y1="50" x2="1000" y2="600"/>
    <line x1="500" y1="50" x2="1200" y2="600"/>
  </g>
</svg>
